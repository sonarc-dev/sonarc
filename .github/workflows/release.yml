# Pushing a tag such as v0.1.0 tests the code, builds the static binaries and
# checksums with `make release`, and publishes them as a GitHub release with
# notes written from the commits since the previous tag. The install script
# downloads from the latest release, and the website's releases page is
# rebuilt when this finishes.
#
# Run it by hand with a tag to rebuild that release and refresh its notes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags and history, for the notes
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make release VERSION="$TAG"
      - run: .github/scripts/release-notes.sh "$TAG" > notes.md
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" build/* --title "$TAG" --notes-file notes.md
          fi
