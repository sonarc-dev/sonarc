# Pushing a tag such as v0.1.0 tests the code, builds the static binaries and
# checksums with `make release`, and publishes them as a GitHub release with
# notes written from the commits since the previous tag. The install script
# downloads from the latest release, and the website's releases page is
# rebuilt when this finishes.
#
# Each binary gets a GitHub provenance attestation, and checksums.txt a
# keyless cosign signature; the README says how to verify both.
#
# Run it by hand with a tag to rebuild that release and refresh its notes.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild, e.g. v0.1.0"
        required: true

permissions:
  contents: write
  id-token: write # keyless signing and provenance
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0 # tags and history, for the notes
      - uses: actions/setup-go@v7
        with:
          go-version: stable # the newest patched release; go.mod is only the minimum
      - run: go test ./...
      - run: make release VERSION="$TAG"
      - name: Record build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/sonarc-*
      - uses: sigstore/cosign-installer@v3
      - name: Sign the checksums
        # Keyless: the signature binds checksums.txt to this workflow run.
        run: cosign sign-blob --yes --bundle build/checksums.txt.sigstore.json build/checksums.txt
      - run: .github/scripts/release-notes.sh "$TAG" > notes.md
      - name: Publish
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" build/* --title "$TAG" --notes-file notes.md
          fi
      - name: Update the Homebrew tap
        # Runs once the HOMEBREW_TAP_TOKEN secret exists: a token that can
        # push to sonarc-dev/homebrew-tap. Then:
        #   brew install sonarc-dev/tap/sonarc
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.TAP_TOKEN != '' && !contains(env.TAG, '-')
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sonarc-dev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          .github/scripts/homebrew-formula.sh "$TAG" build/checksums.txt > tap/Formula/sonarc.rb
          cd tap
          git config user.name "sonarc release"
          git config user.email "sonarc-release@users.noreply.github.com"
          git add Formula/sonarc.rb
          git diff --cached --quiet || git commit -m "sonarc ${TAG#v}"
          git push
