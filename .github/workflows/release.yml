# Pushing a tag such as v0.1.0 tests the code, builds the static binaries and
# checksums with `make release`, and publishes them as a GitHub release. The
# install script downloads from the latest one.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make release VERSION=${{ github.ref_name }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/* --title "${{ github.ref_name }}" --generate-notes
